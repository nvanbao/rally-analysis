<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rally Analysis</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
canvas{flex:1;min-height:0;width:100%;object-fit:contain;background:#000;touch-action:none}
#bar{display:flex;gap:8px;padding:8px;justify-content:center;flex-wrap:wrap;background:#0a0a0a}
button,a.btn{background:#1d1d1d;color:#fff;border:1px solid #f5c542;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;text-decoration:none}
button.rec{background:#d92b2b;border-color:#d92b2b}
#setup{position:fixed;inset:0;background:#0b0b0b;padding:20px;overflow:auto;z-index:5}
#setup h1{font-size:20px;margin:0 0 4px;color:#f5c542;letter-spacing:1px}
#setup p{color:#aaa;font-size:14px;margin:4px 0 14px}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.row i{width:12px;height:12px;border-radius:50%;flex:none}
input{background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:8px;padding:10px;font-size:16px;width:100%}
input.w{width:90px;flex:none}
#go{width:100%;margin-top:10px;background:#f5c542;color:#000;border:0;font-size:17px}
#err{color:#ff7a7a;font-size:14px;margin-top:10px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="bar" class="hide">
    <button id="rec" class="rec">● Ghi hình</button>
    <button id="shot">+ Cú đánh</button>
    <button id="rally">+ Rally</button>
    <button id="redo">⟲ Chỉnh lại</button>
    <a id="dl" class="btn hide">⬇ Tải video</a>
  </div>
</div>

<div id="setup">
  <h1>RALLY ANALYSIS</h1>
  <p>Đặt điện thoại cố định (chân máy) nhìn toàn sân, xoay ngang. Nhập tên và cân nặng (kg); để trống tên nếu không dùng.</p>
  <div id="rows"></div>
  <button id="go">Bật camera</button>
  <div id="err"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const vid = document.createElement('video'); vid.playsInline = true; vid.muted = true;
const COL = ['#4aa3ff', '#ff5a5a', '#b06bff', '#3ddc97'];
const DEF = ['Trung', 'Linh', 'Quoc Anh', 'Lam'];
const CW = 6.1, CL = 13.4; // sân đôi cầu lông (m)

let P = [], corners = [], Hm = null, step = 'setup', pi = 0;
let shots = 0, rally = 1, T = 0, last = 0, fr = 0, prev = null;
let rec = null, chunks = [], recT0 = 0, mic = null, stream = null;
const sm = document.createElement('canvas'); sm.width = 160; sm.height = 90;
const sc = sm.getContext('2d', { willReadFrequently: true });

// ---------- Setup UI ----------
$('#rows').innerHTML = DEF.map((n, i) =>
  `<div class="row"><i style="background:${COL[i]}"></i><input id="n${i}" value="${n}" placeholder="Tên người chơi ${i + 1}"><input class="w" id="w${i}" type="number" value="60" inputmode="numeric"></div>`).join('');

$('#go').onclick = async () => {
  P = [];
  DEF.forEach((_, i) => {
    const n = $('#n' + i).value.trim();
    if (n) P.push({ name: n, w: +$('#w' + i).value || 60, c: COL[i], x: 0, y: 0, fy: 0, m: null, dist: 0 });
  });
  if (!P.length) { $('#err').textContent = 'Nhập ít nhất 1 người chơi.'; return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } },
      audio: false
    });
    vid.srcObject = stream; await vid.play();
    cv.width = vid.videoWidth; cv.height = vid.videoHeight;
    try { await navigator.wakeLock.request('screen'); } catch (e) {}
    $('#setup').classList.add('hide'); $('#bar').classList.remove('hide');
    startCalib();
    loadModel();
    requestAnimationFrame(loop);
  } catch (e) {
    $('#err').textContent = 'Không mở được camera: ' + e.message + ' (cần HTTPS và cấp quyền camera).';
  }
};

function startCalib() { corners = []; Hm = null; step = 'corners'; pi = 0; prev = null; prev2 = null; sh = null; lastShot = null; pend = null; spd = 0; poses = []; shots = 0; rally = 1; }
$('#redo').onclick = startCalib;
$('#shot').onclick = () => shots++;
$('#rally').onclick = () => { rally++; shots = 0; };

// ---------- Hiệu chỉnh sân (homography) ----------
function solveH(src) {
  const dst = [[0, 0], [CW, 0], [CW, CL], [0, CL]];
  const A = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i], [X, Y] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -x * X, -y * X, X]);
    A.push([0, 0, 0, x, y, 1, -x * Y, -y * Y, Y]);
  }
  for (let i = 0; i < 8; i++) {
    let m = i; for (let r = i + 1; r < 8; r++) if (Math.abs(A[r][i]) > Math.abs(A[m][i])) m = r;
    [A[i], A[m]] = [A[m], A[i]];
    for (let r = 0; r < 8; r++) if (r !== i) {
      const f = A[r][i] / A[i][i];
      for (let c = i; c < 9; c++) A[r][c] -= f * A[i][c];
    }
  }
  return A.map((r, i) => r[8] / r[i]);
}
function toM(x, y) {
  const h = Hm, d = h[6] * x + h[7] * y + 1;
  return [(h[0] * x + h[1] * y + h[2]) / d, (h[3] * x + h[4] * y + h[5]) / d];
}

// ---------- Chạm màn hình ----------
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  const k = Math.min(r.width / cv.width, r.height / cv.height);
  const x = (e.clientX - r.left - (r.width - cv.width * k) / 2) / k;
  const y = (e.clientY - r.top - (r.height - cv.height * k) / 2) / k;
  if (x < 0 || y < 0 || x > cv.width || y > cv.height) return;
  if (step === 'corners') {
    corners.push([x, y]);
    if (corners.length === 4) { Hm = solveH(corners); step = 'players'; pi = 0; }
  } else if (step === 'players') {
    const p = P[pi]; p.x = x; p.y = y; p.fy = y + cv.height * 0.08; p.m = null; p.dist = 0;
    if (++pi >= P.length) { step = 'run'; T = 0; prev = null; }
  }
});

// ---------- Tracking người: MoveNet MultiPose (fallback: chuyển động) ----------
let det = null, busy = false, poses = [], modelMsg = 'Đang tải mô hình AI…';
async function loadModel() {
  try {
    await tf.ready();
    det = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,
      { modelType: poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING, enableTracking: true });
    modelMsg = '';
  } catch (e) {
    modelMsg = 'Không tải được AI, dùng tracking chuyển động';
    setTimeout(() => modelMsg = '', 4000);
  }
}
const kp = (po, i) => { const k = po.keypoints[i]; return k && k.score > 0.25 ? k : null; };
function poseFeat(po) {
  const body = [5, 6, 11, 12].map(i => kp(po, i)).filter(Boolean);
  if (!body.length) return null;
  const cx = body.reduce((a, k) => a + k.x, 0) / body.length, cy = body.reduce((a, k) => a + k.y, 0) / body.length;
  const an = [kp(po, 15), kp(po, 16)].filter(Boolean);
  const fy = an.length ? Math.max(...an.map(k => k.y)) : cy + (cy - Math.min(...body.map(k => k.y))) * 2.5;
  const all = po.keypoints.filter(k => k.score > 0.25);
  return { cx, cy, fy, wr: [kp(po, 9), kp(po, 10)].filter(Boolean),
    bb: [Math.min(...all.map(k => k.x)), Math.min(...all.map(k => k.y)), Math.max(...all.map(k => k.x)), Math.max(...all.map(k => k.y))] };
}
function poseStep() {
  if (busy) return; busy = true;
  det.estimatePoses(vid).then(r => { poses = r.map(poseFeat).filter(Boolean); busy = false; assign(); }).catch(() => busy = false);
}
function assign() {
  const pr = [], gate = 260 * S, uj = new Set(), ui = new Set();
  P.forEach((p, i) => poses.forEach((f, j) => pr.push([Math.hypot(f.cx - p.x, f.fy - p.fy), i, j])));
  pr.sort((a, b) => a[0] - b[0]);
  pr.forEach(([d, i, j]) => {
    if (d > gate || ui.has(i) || uj.has(j)) return; ui.add(i); uj.add(j);
    const p = P[i], f = poses[j];
    p.x += .6 * (f.cx - p.x); p.y += .6 * (f.cy - p.y); p.fy += .6 * (f.fy - p.fy); p.wr = f.wr; p.bb = f.bb;
  });
}
function motionTrack() {
  sc.drawImage(vid, 0, 0, 160, 90);
  const d = sc.getImageData(0, 0, 160, 90).data, g = new Uint8Array(14400);
  for (let i = 0; i < 14400; i++) g[i] = (d[i * 4] + d[i * 4 + 1] + d[i * 4 + 2]) / 3;
  if (prev) {
    const kx = cv.width / 160, ky = cv.height / 90;
    P.forEach(p => {
      const cx = p.x / kx, cy = p.y / ky; let n = 0, sx = 0, sy = 0, maxY = 0;
      for (let y = Math.max(0, cy - 22 | 0); y < Math.min(90, cy + 22); y++)
        for (let x = Math.max(0, cx - 12 | 0); x < Math.min(160, cx + 12); x++)
          if (Math.abs(g[y * 160 + x] - prev[y * 160 + x]) > 28) { n++; sx += x; sy += y; if (y > maxY) maxY = y; }
      if (n >= 6) { p.x += .35 * (sx / n * kx - p.x); p.y += .35 * (sy / n * ky - p.y); p.fy += .3 * (maxY * ky - p.fy); }
    });
  }
  prev = g;
}
function updDist(p) {
  const m = toM(p.x, p.fy);
  if (!p.m) { p.m = m; return; }
  const dd = Math.hypot(m[0] - p.m[0], m[1] - p.m[1]);
  if (dd > 0.1 && dd < 2) { p.dist += dd; p.m = m; }
}
function track() {
  if (det) poseStep(); else motionTrack();
  P.forEach(updDist);
  shuttleStep();
}

// ---------- Tracking cầu + phát hiện/phân loại cú đánh ----------
const sm2 = document.createElement('canvas'); sm2.width = 320; sm2.height = 180;
const sc2 = sm2.getContext('2d', { willReadFrequently: true });
let prev2 = null, sh = null, lastShot = null, pend = null, lastShotT = -9, lastSeen = 0, spd = 0;
function inBody(X, Y) {
  return P.some(p => {
    const b = p.bb || [p.x - 45 * S, p.y - 100 * S, p.x + 45 * S, p.fy + 10 * S], mg = 20 * S;
    return X > b[0] - mg && X < b[2] + mg && Y > b[1] - mg && Y < b[3] + mg;
  });
}
function classify(p, vx, vy, sp) {
  const Y = toM(p.x, p.fy)[1], mag = Math.hypot(vx, vy) || 1, ang = vy / mag; // >0: cầu đi xuống màn hình
  if (Math.abs(Y - CL / 2) < 1.9) return ang < -0.1 ? 'LIFT' : 'NET';
  if (Math.abs(ang) < 0.35) return 'DRIVE';
  if (ang > 0) return sp >= 120 ? 'SMASH' : 'DROP';
  return 'CLEAR';
}
function shuttleStep() {
  sc2.drawImage(vid, 0, 0, 320, 180);
  const d = sc2.getImageData(0, 0, 320, 180).data, g = new Uint8Array(57600), k = cv.width / 320;
  for (let i = 0; i < 57600; i++) g[i] = (d[i * 4] + d[i * 4 + 1] + d[i * 4 + 2]) / 3;
  if (prev2) {
    const cl = [];
    for (let y = 1; y < 179; y++) for (let x = 1; x < 319; x++) {
      const i = y * 320 + x;
      if (g[i] > 150 && Math.abs(g[i] - prev2[i]) > 35 && !inBody(x * k, y * k)) {
        const c = cl.find(c => Math.abs(c.x / c.n - x) < 5 && Math.abs(c.y / c.n - y) < 5);
        if (c) { c.x += x; c.y += y; c.n++; } else if (cl.length < 60) cl.push({ x, y, n: 1 });
      }
    }
    let best = null;
    const ok = cl.filter(c => c.n <= 40).map(c => ({ x: c.x / c.n * k, y: c.y / c.n * k, n: c.n }));
    if (sh) {
      const dt = Math.max(T - sh.t, .016), px = sh.x + sh.vx * dt, py = sh.y + sh.vy * dt;
      let bd = 120 * S; ok.forEach(c => { const dd = Math.hypot(c.x - px, c.y - py); if (dd < bd) { bd = dd; best = c; } });
    } else ok.forEach(c => { if (!best || c.n > best.n) best = c; });

    if (best) {
      const nx = best.x, ny = best.y;
      if (sh) {
        const dt = Math.max(T - sh.t, .016), ovx = sh.vx, ovy = sh.vy;
        sh.vx = ovx * .4 + (nx - sh.x) / dt * .6; sh.vy = ovy * .4 + (ny - sh.y) / dt * .6;
        const m1 = toM(sh.x, sh.y), m2 = toM(nx, ny);
        spd = spd * .6 + Math.min(400, Math.hypot(m2[0] - m1[0], m2[1] - m1[1]) / dt * 3.6) * .4;
        const a = Math.hypot(ovx, ovy), b = Math.hypot(sh.vx, sh.vy), th = 180 * S;
        if (a > th && b > th && (ovx * sh.vx + ovy * sh.vy) / (a * b) < .2 && T - lastShotT > .4) {
          let bp = null, bd = 170 * S;
          P.forEach(p => (p.wr || []).concat([{ x: p.x, y: p.y }]).forEach(w => {
            const dd = Math.hypot(w.x - nx, w.y - ny); if (dd < bd) { bd = dd; bp = p; }
          }));
          if (bp) { lastShotT = T; shots++; pend = { p: bp, t: T }; lastShot = { p: bp, type: '…', n: shots }; }
        }
        sh.x = nx; sh.y = ny; sh.t = T; sh.lost = 0; sh.trail.push([nx, ny]); if (sh.trail.length > 14) sh.trail.shift();
      } else sh = { x: nx, y: ny, vx: 0, vy: 0, t: T, lost: 0, trail: [[nx, ny]] };
      lastSeen = T;
    } else if (sh && ++sh.lost > 8) sh = null;
  }
  prev2 = g;
  if (pend) {
    if (sh && T - pend.t > .15) { lastShot.type = classify(pend.p, sh.vx, sh.vy, spd); pend = null; }
    else if (T - pend.t > 1) { lastShot.type = 'SHOT'; pend = null; }
  }
  if (!sh && shots > 1 && T - lastSeen > 3) { rally++; shots = 0; lastShot = null; }
}
function drawShuttle() {
  if (!sh) return;
  ctx.lineWidth = 2 * S;
  for (let i = 1; i < sh.trail.length; i++) {
    ctx.strokeStyle = `rgba(255,255,255,${i / sh.trail.length})`; ctx.beginPath();
    ctx.moveTo(sh.trail[i - 1][0], sh.trail[i - 1][1]); ctx.lineTo(sh.trail[i][0], sh.trail[i][1]); ctx.stroke();
  }
  ctx.strokeStyle = '#f5c542'; ctx.beginPath(); ctx.arc(sh.x, sh.y, 9 * S, 0, 7); ctx.stroke();
  const t = 'LOCK ON ' + Math.round(spd) + ' km/h', w = ctx.measureText(t).width + 12 * S;
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(sh.x + 12 * S, sh.y - 22 * S, w + 20 * S, 18 * S);
  txt(t, sh.x + 18 * S, sh.y - 8 * S, 11, '#f5c542');
}

// ---------- Vẽ HUD ----------
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 1.5 * S;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 6 * S); ctx.fill(); ctx.stroke();
}
function txt(t, x, y, size, color = '#fff', align = 'left', style = '700') {
  ctx.font = `${style} ${size * S}px "Arial Narrow",Arial,sans-serif`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(t, x, y);
}
let S = 1;
function hud() {
  S = cv.width / 1280; const W = cv.width, Hh = cv.height, m = 14 * S;
  txt('RALLY ANALYSIS', m + 6 * S, 30 * S, 14, '#f5c542');
  if (modelMsg) txt(modelMsg, W / 2, 60 * S, 14, '#f5c542', 'center');

  if (step === 'corners') {
    const names = ['góc TRÁI-TRÊN (xa)', 'góc PHẢI-TRÊN (xa)', 'góc PHẢI-DƯỚI (gần)', 'góc TRÁI-DƯỚI (gần)'];
    banner(`Chạm ${names[corners.length]} của sân (${corners.length}/4)`);
  }
  if (corners.length) {
    ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 2 * S; ctx.beginPath();
    corners.forEach((c, i) => i ? ctx.lineTo(c[0], c[1]) : ctx.moveTo(c[0], c[1]));
    if (corners.length === 4) ctx.closePath(); ctx.stroke();
    corners.forEach(c => { ctx.fillStyle = '#f5c542'; ctx.beginPath(); ctx.arc(c[0], c[1], 6 * S, 0, 7); ctx.fill(); });
  }
  if (step === 'players') banner(`Chạm vào người chơi: ${P[pi].name}`, P[pi].c);
  if (step !== 'run') return;

  // vòng chân + nhãn tên
  P.forEach(p => {
    ctx.strokeStyle = p.c; ctx.lineWidth = 3 * S;
    ctx.beginPath(); ctx.ellipse(p.x, p.fy, 38 * S, 12 * S, 0, 0, 7); ctx.stroke();
    ctx.globalAlpha = .35; ctx.beginPath(); ctx.ellipse(p.x, p.fy, 58 * S, 18 * S, 0, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    const tw = ctx.measureText(p.name).width + 16 * S;
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(p.x - 30 * S, p.y - 110 * S, tw, 20 * S);
    ctx.fillStyle = p.c; ctx.fillRect(p.x - 30 * S, p.y - 110 * S, 3 * S, 20 * S);
    txt(p.name, p.x - 22 * S, p.y - 95 * S, 13);
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.setLineDash([3 * S, 3 * S]);
    ctx.beginPath(); ctx.moveTo(p.x, p.y - 90 * S); ctx.lineTo(p.x, p.fy); ctx.stroke(); ctx.setLineDash([]);
  });

  drawShuttle();
  // SHUTTLE SPEED + SHOT TYPE
  panel(m, 46 * S, 190 * S, 62 * S);
  txt('SHUTTLE SPEED', m + 10 * S, 64 * S, 10, '#ccc');
  txt((sh ? Math.round(spd) : '--') + ' km/h', m + 10 * S, 92 * S, 26, '#fff', 'left', 'italic 800');
  txt('avg. horizontal · estimate', m + 10 * S, 104 * S, 8, '#aaa', 'left', '400');
  panel(m, 116 * S, 190 * S, 44 * S);
  txt('SHOT TYPE', m + 10 * S, 132 * S, 10, '#ccc');
  txt(lastShot ? lastShot.type : '—', m + 10 * S, 152 * S, 18, '#f5c542', 'left', 'italic 800');
  if (lastShot) txt(lastShot.p.name + ' · shot ' + lastShot.n, m + 180 * S, 132 * S, 9, '#ccc', 'right', '400');

  // SHOT NO.
  panel(W - m - 110 * S, m, 110 * S, 78 * S);
  txt('SHOT NO.', W - m - 55 * S, m + 18 * S, 11, '#ccc', 'center');
  txt(String(shots).padStart(2, '0'), W - m - 55 * S, m + 56 * S, 38, '#fff', 'center', '800');
  txt('rally ' + rally, W - m - 55 * S, m + 72 * S, 10, '#aaa', 'center');

  // DISTANCE & CALORIES
  const ph = (36 + P.length * 24) * S, py = Hh - m - ph - 22 * S;
  panel(m, py, 280 * S, ph);
  txt('DISTANCE & CALORIES', m + 10 * S, py + 18 * S, 11, '#ccc');
  P.forEach((p, i) => {
    const y = py + 40 * S + i * 24 * S, kc = 5.5 * p.w * T / 3600;
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(m + 16 * S, y - 5 * S, 5 * S, 0, 7); ctx.fill();
    txt(p.name, m + 30 * S, y, 13);
    txt(kc.toFixed(1) + ' kcal', m + 170 * S, y, 13, '#fff', 'right');
    txt(Math.round(p.dist) + ' m', m + 268 * S, y, 13, '#fff', 'right');
  });
  txt('floor path · calories estimated', m + 6 * S, Hh - m - 6 * S, 10, '#bbb', 'left', '400');

  // COURT MAP
  const mw = 100 * S, mh = 200 * S, mx = W - m - mw, my = Hh - m - mh - 22 * S;
  panel(mx - 6 * S, my - 18 * S, mw + 12 * S, mh + 24 * S);
  txt('COURT MAP', mx + mw / 2, my - 5 * S, 10, '#ccc', 'center');
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = S; ctx.strokeRect(mx, my, mw, mh);
  ctx.beginPath(); ctx.moveTo(mx, my + mh / 2); ctx.lineTo(mx + mw, my + mh / 2); ctx.stroke();
  P.forEach(p => {
    if (!p.m) return;
    const X = Math.max(0, Math.min(1, p.m[0] / CW)), Y = Math.max(0, Math.min(1, p.m[1] / CL));
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(mx + X * mw, my + Y * mh, 5 * S, 0, 7); ctx.fill();
  });
  txt('Shots reviewed by players · motion & speed estimated', W / 2, Hh - 8 * S, 11, '#ddd', 'center', '400');

  if (rec) {
    const s = ((performance.now() - recT0) / 1000) | 0;
    const t = String((s / 60) | 0).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    ctx.fillStyle = '#ff2b2b'; ctx.beginPath(); ctx.arc(W / 2 - 30 * S, 24 * S, 7 * S, 0, 7); ctx.fill();
    txt('REC ' + t, W / 2 - 18 * S, 30 * S, 16);
  }
}
function banner(t, c = '#f5c542') {
  const W = cv.width; ctx.fillStyle = 'rgba(0,0,0,.75)';
  ctx.fillRect(0, cv.height / 2 - 28 * S, W, 56 * S);
  txt(t, W / 2, cv.height / 2 + 8 * S, 22, c, 'center');
}

function loop(ts) {
  requestAnimationFrame(loop);
  if (!vid.videoWidth) return;
  const dt = (ts - last) / 1000; last = ts;
  ctx.drawImage(vid, 0, 0, cv.width, cv.height);
  if (step === 'run') { T += Math.min(dt, .2); if (fr++ % 2 === 0) track(); }
  hud();
}

// ---------- Ghi hình (có sẵn overlay) ----------
$('#rec').onclick = async () => {
  if (rec) { rec.stop(); return; }
  const out = cv.captureStream(30);
  try { mic = await navigator.mediaDevices.getUserMedia({ audio: true }); mic.getAudioTracks().forEach(t => out.addTrack(t)); } catch (e) {}
  const mime = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
  chunks = [];
  rec = new MediaRecorder(out, mime ? { mimeType: mime, videoBitsPerSecond: 6e6 } : {});
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const type = rec.mimeType || 'video/webm', ext = type.includes('mp4') ? 'mp4' : 'webm';
    const a = $('#dl'); a.href = URL.createObjectURL(new Blob(chunks, { type }));
    a.download = 'rally-' + new Date().toISOString().replace(/[:.]/g, '-') + '.' + ext;
    a.classList.remove('hide');
    if (mic) mic.getTracks().forEach(t => t.stop());
    rec = null; $('#rec').textContent = '● Ghi hình';
  };
  rec.start(1000); recT0 = performance.now();
  $('#dl').classList.add('hide'); $('#rec').textContent = '■ Dừng';
};
</script>
